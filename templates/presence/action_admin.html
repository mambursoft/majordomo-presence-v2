<form action="?" method="post" class="form-horizontal">
<div class="form-group">
 <label class="control-label"><#LANG_PV_RSSI#></label>
 <div class="controls"><input type="number" name="rssi_min" min="-120" max="0" value="[#RSSI_MIN#]" class="form-control"></div>
</div>
<div class="form-group">
 <label class="control-label"><#LANG_PV_TIMEOUT#></label>
 <div class="controls"><input type="number" name="timeout" min="5" max="3600" value="[#TIMEOUT#]" class="form-control"></div>
</div>
<div class="form-group">
 <label class="control-label"><#LANG_PV_TAGS#></label>
 <div class="controls"><textarea name="tags" rows="6" class="form-control">[#TAGS#]</textarea></div>
</div>
<div class="form-actions">
 <button type="submit" class="btn btn-primary"><#LANG_UPDATE#></button>
 <button type="button" onclick="return pvTest();" class="btn btn-default"><#LANG_PV_TEST#></button>
 <input type="hidden" name="mode" value="update">
</div>
</form>
<p class="help-block"><#LANG_PV_HINT#></p>
<script>
function pvTest() {
 var data = new FormData();
 data.append('payload', '{"uuid":"test-tag","rssi":-60}');
 fetch('/modules/presence/ajax.php', {method:'POST', body:data, credentials:'same-origin'})
 .then(function(r){return r.json();})
 .then(function(res){alert(res.status + ': ' + res.property);})
 .catch(function(){alert('<#LANG_PV_ERROR#>');});
 return false;
}
</script>
